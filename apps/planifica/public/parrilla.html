<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Planifica</title>
    <meta name="description"
      content="Parrilla de contenido: planificación, producción y objetivos.">
    <script src="/js/tema.js"></script>
    <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
    <link rel="stylesheet" href="/_ds/diseno/diseno.css">
    <link rel="stylesheet" href="/css/tema.css">
    <link rel="stylesheet" href="/css/app.css">
    <link rel="stylesheet" href="/css/parrilla.css">
    <link rel="stylesheet" href="/css/componentes.css">
  </head>
  <body>
    <div class="wrap" id="app">
      <header class="top">
        <div class="top-row">
          <div class="brand">
            <a href="/" class="mark"
              aria-label="Planifica: inicio"><i class="on"></i><i></i><i></i><i></i><i class="on"></i><i></i><i></i><i></i><i class="on"></i></a>
            <span class="brand-name">Planifica</span>
          </div>
          <span class="tsep" aria-hidden="true"></span>
          <div class="cli">
            <a class="cli-name" id="volver" href="/" title="Cambiar de marca"><span class="cli-l1"><b id="cliente-nombre"></b><svg
                viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"
                stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 6.5l3-3 3 3M5 9.5l3 3 3-3" /></svg></span><span
                class="cli-acct" id="acct" hidden></span><span class="sr">Cambiar de marca</span></a>
          </div>
          <div class="tacts">
            <a class="btn ghost ver-cliente" id="verCliente" href="#" hidden title="Ver la parrilla como la ve el cliente (solo lectura)"><svg
                viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
                stroke-linejoin="round" aria-hidden="true"><path d="M1.5 8s2.4-4.5 6.5-4.5S14.5 8 14.5 8 12.1 12.5 8 12.5 1.5 8 1.5 8z" /><circle
                  cx="8" cy="8" r="2" /></svg><span class="vc-l">Ver como cliente</span></a>
            <button class="btn primary" id="newPost" type="button"
              data-act="new">+ <span class="nw-long">Nuevo post</span><span class="nw-short">Nuevo</span></button>
            <span id="avatar"></span>
          </div>
        </div>
        <nav class="tabs" aria-label="Vistas">
          <a href="#rendimiento" data-nav="rendimiento"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 13.5h11"/><path d="M4.5 11V8"/><path d="M8 11V4.5"/><path d="M11.5 11V6.5"/></svg><span>Rendimiento</span></a>
          <a href="#lista" data-nav="lista"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5.5 4h8M5.5 8h8M5.5 12h8"/><circle cx="2.75" cy="4" r=".6" fill="currentColor"/><circle cx="2.75" cy="8" r=".6" fill="currentColor"/><circle cx="2.75" cy="12" r=".6" fill="currentColor"/></svg><span>Lista</span></a>
          <a href="#calendario" data-nav="calendario"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="3" width="12" height="11" rx="2"/><path d="M2 6.5h12M5.5 1.75v2.5M10.5 1.75v2.5"/></svg><span>Calendario</span></a>
          <a href="#objetivos" data-nav="objetivos"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="8" r="6"/><circle cx="8" cy="8" r="3"/><circle cx="8" cy="8" r=".6" fill="currentColor"/></svg><span>Objetivos</span></a>
          <a href="#pauta" data-nav="pauta"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="1.75" y="4.5" width="9" height="8" rx="1.5"/><path d="M10.75 7.25l3.5-2v6.5l-3.5-2"/></svg><span>Pauta</span></a>
        </nav>
      </header>
      <main id="main">
        <p class="cargando">Cargando…</p>
      </main>
    </div>
    <div id="toast" role="status" aria-live="polite"></div>
    <noscript><p style="padding:20px">Esta aplicación necesita JavaScript para funcionar.</p></noscript>
    <script src="/vendor/jspdf.umd.min.js"></script>
    <script type="module" src="/js/conexion.js"></script>
    <script type="module" src="/js/parrilla.js"></script>
  </body>
</html>
